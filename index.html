<!DOCTYPE html>
<html>

<head>
    <title>Dashboard de Torneos Gamer</title>
    <script src="dashboard.js"></script>
    <link rel="stylesheet" href="estilos.css" />
</head>

<body>
    <h1>Dashboard de Torneos Gamer</h1>
    <div class="divFormulario">
        <p>Nombre del torneo</p>
        <input class= "txtInput" id="txtNombreTorneo" type="text" />
        <div class="divError">
            <p id="txtNombreTorneoError"></p>
        </div>

        <p>Categoría</p>
        <input class= "txtInput" id="txtCategoria" type="text" placeholder=" Lucha, Estrategia, Arcade, Deportes, Aventura" />
        <div class="divError">
            <p id="txtCategoriaError"></p>
        </div>

        <p>Participantes</p>
        <input class= "txtInput" id="txtParticipantes" type="text" />
        <div class="divError">
            <p id="txtParticipantesError"></p>
        </div>

        <p>Valor de Inscripción</p>
        <input class= "txtInput" id="txtValorInscripcion" type="text" />
        <div class="divError">
            <p id="txtValorInscripcionError"></p>
        </div>

        <p>Email organizador</p>
        <input class= "txtInput" id="txtEmail" type="text" />
        <div class="divError">
            <p id="txtEmailError"></p>
        </div>

    </div>
    <input type="button" value="REGISTRAR TORNEO" onclick="registrarTorneo();" />
    <p id="txtRegistro"></p>

    <h2>Tabla de Resgistros</h2>
    <div class="tabla">
        <table>
            <thead>
                <tr>
                    <th>Nombre del torneo</th>
                    <th>Categoría</th>
                    <th>Participantes</th>
                    <th>Valor de Inscripción</th>
                    <th>Email organizador</th>
                    <th>Recaudación Estimada</th>
                </tr>
            </thead>
            <tbody id="tablaContenido">
                <tr>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
            </tbody>
        </table>
    </div>

</body>

</html>
